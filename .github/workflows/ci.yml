name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend — install and syntax check
        run: |
          npm ci --no-audit --no-fund
          node --check server.js
      - name: Frontend — install and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: API smoke tests (no Claude calls)
        env:
          ANTHROPIC_API_KEY: ci-dummy-key
          JWT_SECRET: ci-smoke-secret
          PORT: "3101"
          SMOKE_BASE_URL: http://127.0.0.1:3101
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$SMOKE_BASE_URL/api/health" > /dev/null && break; sleep 1; done
          if ! node tests/smoke.mjs; then echo '--- server.log ---'; cat server.log; exit 1; fi